title: "⑥の未カバー領域＋規制強化で需要が強制される領域"
asof: "2026-08-12"
source_note: >
  Future100 docs/discovery_mission.md §4「未探索（次の狙い目）」＝⑥の中の未カバー領域
  （上下水道の運転維持管理・電力保安・鉄道保守）と「規制強化で需要が強制される領域」。
  【重要】**下記の code はすべて「仮説」であって確定値ではない**。screener の
  candidates サブコマンドが finance.yahoo.co.jp から取得した社名と突き合わせ、
  一致しないものは「証券コード未確認」として扱う（§8）。突合は金融DBとの照合＝準一次で
  あり、昇格判断の前には有報・短信の原本でコードを確認すること。

groups:
  # --------------------------------------------------------------------------
  - label: "⑥-a 上下水道の運転維持管理（O&M・コンサル。設備メーカー本体ではない）"
    theme: >
      水道管路の老朽化と自治体の技術者不足で、施設の「運転維持管理」を民間へ委託する
      流れ（官民連携・ウォーターPPP）。設備を売る会社ではなく、**回し続ける会社**を探す。
      床＝長期の受託契約による安定収益。
    candidates:
      - { name: "メタウォーター", code: "9551", note: "上下水道プラント＋O&M。O&M比率が高い" }
      - { name: "NJS", code: "2325", note: "上下水道コンサル専業。管路更新の計画側" }
      - { name: "オリジナル設計", code: "4642", note: "上下水道コンサル。小型" }
      - { name: "ID&Eホールディングス", code: "9161", note: "旧日本工営。インフラコンサル大手" }
      - { name: "月島ホールディングス", code: "6332", note: "旧月島機械。下水汚泥処理・PFI/DBO運営" }
      - { name: "水道機工", code: "6403", note: "浄水処理設備。栗田工業系・小型" }
      - { name: "三機工業", code: "1961", note: "環境システム（水処理）＋設備工事" }
      - { name: "日本管財ホールディングス", code: "9347", note: "建物・環境施設管理。公共施設の受託運営" }

  # --------------------------------------------------------------------------
  - label: "⑥-b 電力保安・送配電設備の保守"
    theme: >
      送配電網の老朽化更新に加え、**電気保安人材の不足**（電気主任技術者の高齢化）で
      保安業務の外部委託・スマート保安が制度的に後押しされる領域。
      発電所の定期点検・メンテナンスも同じ床を持つ。
    candidates:
      - { name: "関電工", code: "1942", note: "東電系。屋内外電気設備工事" }
      - { name: "きんでん", code: "1944", note: "関電系" }
      - { name: "トーエネック", code: "1946", note: "中部電力系。配電線工事" }
      - { name: "中電工", code: "1941", note: "中国電力系" }
      # 【2026-08-12訂正】社名突合で不一致→調べたら**コードは正しく、社名が古かった**。
      # 九電工は2025-10-01付で「株式会社クラフティア(KRAFTIA)」へ商号変更（36年ぶり）。
      # 関東・関西の売上が3割超、空調工事の伸びで事業領域が電気工事から広がったため。
      - { name: "クラフティア", code: "1959", note: "旧九電工。九州電力系。2029年度までの中計Challenge & Grow 2029でGXへ集中投資" }
      - { name: "住友電設", code: "1949", note: "住友電工系" }
      - { name: "東京エネシス", code: "1945", note: "発電所の建設・保守点検。東電系" }
      - { name: "太平電業", code: "1968", note: "発電所メンテナンス専業に近い" }
      - { name: "日本電技", code: "1723", note: "空調計装＋電気設備。保守サービス比率" }

  # --------------------------------------------------------------------------
  - label: "⑥-c 鉄道保守（軌道・電気・信号）"
    theme: >
      鉄道インフラの老朽化更新と保守。夜間の限られた時間に施工する参入障壁があり、
      各社ともJR各社の系列で受注が安定（＝床）。**踏切・信号の更新は安全規制と直結**。
    candidates:
      - { name: "東鉄工業", code: "1835", note: "JR東系。軌道工事最大手" }
      - { name: "第一建設工業", code: "1799", note: "JR東系。新潟地盤の鉄道土木" }
      # 【2026-08-12訂正】1869.T は404。**名工建設は名証上場**なので .N を明示する。
      # 愛知電機(6623.N)と同じ型＝「取得できない＝api都合」と決めつけない（引き継ぎ書§6）。
      - { name: "名工建設", code: "1869", ticker: "1869.N", note: "JR東海系。鉄道土木。名証単独上場" }
      - { name: "鉄建建設", code: "1815", note: "JR東系。鉄道土木大手" }
      - { name: "日本電設工業", code: "1950", note: "JR東系。鉄道電気工事＝⑥-bとも重なる" }
      - { name: "日本信号", code: "6741", note: "鉄道信号・ホームドア・自動改札" }
      - { name: "京三製作所", code: "6742", note: "鉄道信号＋道路交通信号" }
      - { name: "大同信号", code: "6743", note: "鉄道信号。小型" }

  # --------------------------------------------------------------------------
  - label: "規制強化で需要が強制される領域"
    theme: >
      「買うかどうか」を客が選べない需要＝法令で義務づけられた調査・点検・処理。
      景気にも半導体サイクルにも連動しにくい。土壌汚染対策法、石綿（アスベスト）事前調査の
      義務化、PCB廃棄物の処理期限、消防設備の定期点検、インフラの近接目視点検など。
    candidates:
      - { name: "ベステラ", code: "1433", note: "プラント解体。アスベスト・PCBを伴う工事" }
      - { name: "ダイセキ", code: "9793", note: "産業廃棄物処理（廃油・廃液）" }
      - { name: "ダイセキ環境ソリューション", code: "1712", note: "土壌汚染対策法の調査・浄化" }
      - { name: "エンビプロホールディングス", code: "5698", note: "資源循環。規制で回る" }
      - { name: "能美防災", code: "6744", note: "消防設備。設置・点検が法定義務" }
      - { name: "ホーチキ", code: "6745", note: "火災報知。同上" }
      - { name: "日本ドライケミカル", code: "1909", note: "消火設備の設置・保守点検" }
      - { name: "応用地質", code: "9755", note: "地盤・防災調査。点検義務と国土強靭化の両取り" }
      - { name: "建設技術研究所", code: "9621", note: "建設コンサル。点検・長寿命化計画の策定側" }
      - { name: "環境管理センター", code: "4657", note: "環境計量証明・分析。法定測定" }
