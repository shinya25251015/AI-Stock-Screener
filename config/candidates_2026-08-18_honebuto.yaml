title: "骨太の方針2026×海底レアアースからの連想発掘"
asof: "2026-08-18"
source_note: >
  ユーザー指示「海底レアアースが盛んになれば精錬企業が発展するのでは。その他の国策骨太指針で
  恩恵を受ける企業を連想ゲームのように発掘して」による。
  【鉄則との関係】discovery_mission §1-1「テーマから入らない」に**あえて反する**進め方なので、
  安さ足切りを必ずゲートに置き、通過しなかったものは記録して捨てる（裁量と明記）。
  【原本】「経済財政運営と改革の基本方針2026」令和8年7月21日閣議決定（内閣府PDF全42ページを
  直接取得・精読）。および JAMSTEC 2026-02-02 速報・2026-07-24 結果公表。
  【原本の言及数（42ページ全文）】医療73／介護23／インフラ22／資源19／防衛17／経済安全保障16／
  海洋12／国土強靱化11／宇宙11／食料10／老朽化7／物流7／鉄道6／創薬6／量子5／原子力4／港湾4／
  海底3／半導体3／重要鉱物2／次世代革新炉2／造船2／**南鳥島1**。
  → **医療・介護が圧倒的に重心**。半導体・AIは意外に少ない。
  【重要な留保】海底レアアースは**2028年度以降の産業化目標**で、2027年2月に大規模実証試験の段階。
  床のない期待先行になりやすい＝「床＋オプション」型かどうかを個別に見る。

groups:
  - label: "A-1 海洋土木・サルベージ（揚泥・洋上作業の担い手）"
    theme: >
      原本の成長戦略に「**革新的海底開発技術・システム**」を明記。JAMSTECの「ちきゅう」は
      2026-02-01に水深約6,000mから最初のレアアース泥の揚泥に成功し、2027年2月に大規模実証、
      2028年度以降の産業化を目指す。海洋工事の実務側を担える会社を見る。
    candidates:
      - { name: "深田サルベージ建設", code: "1834", note: "海洋土木・サルベージ専業。小型" }
      - { name: "五洋建設", code: "1893", note: "海洋土木最大手。洋上風力でも中核" }
      - { name: "若築建設", code: "1888", note: "港湾・海洋土木" }

  - label: "A-2 流体機器（深海からの揚泥ポンプ）"
    theme: >
      水深6,000mからの揚泥はポンプ・配管技術そのもの。原本の「革新的海底開発技術」の
      実装側にあたる。※各社が南鳥島案件に関与しているかは**未確認＝連想の域**。
    candidates:
      - { name: "荏原", code: "6361", note: "ポンプ最大手＋半導体CMP装置" }
      - { name: "酉島製作所", code: "6363", note: "大型ポンプ専業。海水淡水化にも" }
      - { name: "電業社機械製作所", code: "6365", note: "ポンプ・送風機。小型" }

  - label: "A-3 永久磁石・磁性材料（レアアースの出口）"
    theme: >
      原本の成長戦略に「**永久磁石**」を名指しで明記。レアアースを掘っても、
      磁石にする側がなければ需要が立たない＝連想の川下。
    candidates:
      - { name: "大同特殊鋼", code: "5471", note: "ネオジム磁石・特殊鋼" }
      - { name: "愛知製鋼", code: "5482", note: "磁石・鍛造。トヨタ系" }
      - { name: "ＴＤＫ", code: "6762", note: "磁性材料・電子部品" }
      - { name: "信越化学工業", code: "4063", note: "レアアース磁石＋半導体シリコン" }

  - label: "A-4 海洋観測・海洋状況把握（MDA）・海洋ドローン"
    theme: >
      原本の成長戦略に「**海洋無人機（海洋ドローン）**」「**海洋状況把握（ＭＤＡ）**」
      「海底ケーブル」を明記。資源探査の前工程＝調査・観測側。
    candidates:
      - { name: "いであ", code: "9768", note: "環境・海洋調査コンサル。小型" }
      - { name: "古野電気", code: "6814", note: "舶用電子機器・魚探・ソナー" }
      - { name: "日本無線", code: "6751", note: "舶用通信・レーダー" }
      - { name: "三井Ｅ＆Ｓ", code: "7003", note: "港湾クレーン＋舶用機械" }

  - label: "B 港湾ロジスティクス（17分野に明記）"
    theme: >
      原本の脚注6で成長戦略の**17分野**の1つに「**港湾ロジスティクス**」を明記
      （他はAI・半導体／デジタル・サイバーセキュリティ／情報通信／量子／防衛産業／航空・宇宙／
      海洋／造船／マテリアル（重要鉱物・部素材）／合成生物学・バイオ／創薬・先端医療／
      資源・エネルギー安全保障・GX／フュージョンエネルギー／防災・国土強靱化／フードテック／
      コンテンツ）。海底資源を陸揚げする先でもある。
    candidates:
      - { name: "上組", code: "9364", note: "港湾運送最大手" }
      - { name: "三井倉庫ホールディングス", code: "9302", note: "倉庫・港湾物流" }
      - { name: "山九", code: "9065", note: "プラント構内物流・重量物据付" }
      - { name: "住友倉庫", code: "9303", note: "倉庫・港湾運送" }

  - label: "C 医療・介護（原本の言及数が最大＝96件。本プロジェクト未探索）"
    theme: >
      連想を「レアアース」から離して**原本の重心**に合わせた群。医療73件・介護23件は
      他のどの分野より多い。ただし本プロジェクトは医療DXを既に一度見送っている
      （エムティーアイ9438・テクマトリックス3762）ので、**介護の現業側**を中心に見る。
    candidates:
      - { name: "セントケア・ホールディング", code: "2374", note: "在宅介護。小型" }
      - { name: "シダー", code: "2435", note: "通所介護。小型" }
      - { name: "日本調剤", code: "3341", note: "調剤薬局＋後発薬" }
