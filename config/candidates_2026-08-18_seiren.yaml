title: "非鉄製錬・精錬・貴金属リサイクル"
asof: "2026-08-18"
source_note: >
  ユーザー指示「精錬企業は？」による発掘パス。既存記録では未探索の領域
  （2026-07-27に⑦でチタン2社だけ検証済み: 大阪チタニウム5726=発見済み＋フロア割れ、
  東邦チタニウム5727=JX金属へ株式交換で2026-06に上場廃止）。
  【重要】下記の code はすべて「仮説」。candidates サブコマンドが取得社名と突合して検証する（§8）。
  【この業種固有の注意】製錬は**市況（銅・亜鉛・ニッケル・金）に業績が直結する典型的な
  シクリカル**で、実績ROEは金属価格のピークで大きく膨らむ。名村造船所を「造船好況のピーク」で
  却下したのと同じ罠がある。**会社予想ROEでの山検算と、特別損益チェックを必ず通すこと。**
  また製錬所は巨額の設備を持つため減損・操業トラブルの特別損失も出やすい（両方向に効く）。

groups:
  - label: "非鉄製錬大手（銅・亜鉛・ニッケル・アルミ）"
    theme: >
      2035テーマの候補は「重要鉱物の国内供給網（経済安保）」「EV・蓄電池材料」
      「半導体向け高純度金属」。ただしテーマから入らない——先に安さで足切りする。
    candidates:
      - { name: "住友金属鉱山", code: "5713", note: "銅・ニッケル・電池正極材。非鉄大手" }
      - { name: "三菱マテリアル", code: "5711", note: "銅製錬＋加工＋リサイクル" }
      - { name: "三井金属鉱業", code: "5706", note: "亜鉛・銅製錬＋極薄銅箔(半導体)" }
      - { name: "DOWAホールディングス", code: "5714", note: "亜鉛・貴金属リサイクル・環境" }
      - { name: "東邦亜鉛", code: "5707", note: "亜鉛製錬。小型" }
      - { name: "日本軽金属ホールディングス", code: "5703", note: "アルミ一貫" }
      - { name: "古河機械金属", code: "5715", note: "銅製錬＋産業機械＋電子材料" }
      - { name: "JX金属", code: "5016", note: "半導体材料・銅箔。2025年上場。※コードは仮説" }

  - label: "特殊金属・合金鉄・チタン"
    theme: "航空機・半導体・耐熱用途。市況と設備投資サイクルの両方に振られる。"
    candidates:
      - { name: "大阪チタニウムテクノロジーズ", code: "5726", note: "2026-07-27に発見済み＋フロア割れで却下。再確認" }
      - { name: "日本冶金工業", code: "5480", note: "高機能ステンレス・ニッケル系合金" }
      - { name: "大平洋金属", code: "5541", note: "フェロニッケル専業。市況直結" }
      - { name: "日本電工", code: "5563", note: "合金鉄（マンガン系）＋機能材料" }
      - { name: "大紀アルミニウム工業所", code: "5702", note: "アルミ2次合金。リサイクル原料" }

  - label: "貴金属リサイクル・都市鉱山（製錬の川下／規制と資源循環）"
    theme: >
      鉱石からではなく**廃電子基板・スクラップから回収**する側。原料が国内で完結し、
      鉱山リスクを持たない。半導体・電子部品の生産量に連動する。
    candidates:
      - { name: "アサヒホールディングス", code: "5857", note: "貴金属リサイクル最大手級" }
      - { name: "松田産業", code: "7456", note: "貴金属リサイクル＋食品の二本柱" }
      - { name: "徳力本店", code: "5843", note: "貴金属。小型" }
      - { name: "日鉄鉱業", code: "1515", note: "石灰石・銅鉱山・環境。日本製鉄系" }
